# software directory
PATH_SEX:  # SExtractor program file directory
  /opt/homebrew/Cellar/sextractor/2.28.0/share/sextractor
PATH_EAZY:  # EAZY program file directory
  /Users/rui/Applications/eazy-photoz

# Quick Directory
DIR_DOWNLOAD:  # Default save file path
  /Users/rui/Downloads
DIR_DATA:  # Database in this equipment
  /Users/rui/Data

# Email notifications: each user keeps their own credentials in ~/.astrokit_config.yaml.
# Run chmod 600 ~/.astrokit_config.yaml before using ak.send_email().
email:
  smtp_host: smtp.example.org
  smtp_port: 465
  security: ssl  # ssl or starttls (usually port 587)
  username: ""
  password: ""  # client/app password; never commit real credentials
  from_address: ""  # optional; defaults to username
  display_name: astrokit
  max_message_mb: 25
